name: CI - Lint & Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck - Lint Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Run ShellCheck on all shell scripts
        run: |
          echo "::group::Finding shell scripts"
          SCRIPTS=$(find . -maxdepth 1 -name '*.sh' -type f | sort)
          echo "Found scripts:"
          echo "$SCRIPTS"
          echo "::endgroup::"

          FAILED=0
          for script in $SCRIPTS; do
            echo "::group::Checking $script"
            if shellcheck --severity=error "$script"; then
              echo "PASS: $script"
            else
              echo "FAIL: $script"
              FAILED=1
            fi
            echo "::endgroup::"
          done

          if [ "$FAILED" -eq 1 ]; then
            echo "::error::ShellCheck found errors in one or more scripts"
            exit 1
          fi
          echo "All shell scripts passed ShellCheck (severity=error)"

  yaml-lint:
    name: YAML Lint - Validate YAML Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Create yamllint config
        run: |
          cat > .yamllint.yml <<'EOF'
          extends: default
          rules:
            line-length:
              max: 500
              allow-non-breakable-inline-mappings: true
            truthy:
              check-keys: false
            comments:
              min-spaces-from-content: 1
            document-start: disable
            indentation:
              spaces: 2
              indent-sequences: consistent
          EOF

      - name: Run yamllint on YAML files
        run: |
          echo "::group::Finding YAML files"
          YAMLS=$(find . -maxdepth 1 \( -name '*.yaml' -o -name '*.yml' \) -type f | sort)
          echo "Found YAML files:"
          echo "$YAMLS"
          echo "::endgroup::"

          FAILED=0
          for yaml in $YAMLS; do
            echo "::group::Checking $yaml"
            if yamllint -c .yamllint.yml "$yaml"; then
              echo "PASS: $yaml"
            else
              echo "FAIL: $yaml"
              FAILED=1
            fi
            echo "::endgroup::"
          done

          if [ "$FAILED" -eq 1 ]; then
            echo "::error::yamllint found errors in one or more YAML files"
            exit 1
          fi
          echo "All YAML files passed yamllint"

  vagrantfile-syntax:
    name: Vagrantfile - Ruby Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Vagrantfile Ruby syntax
        run: |
          echo "Checking Vagrantfile syntax..."
          ruby -c Vagrantfile
          echo "Vagrantfile syntax is valid"

  version-consistency:
    name: Version Consistency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run version consistency tests
        run: bash tests/check_versions.sh

  validate-urls:
    name: Validate Download URLs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that download URLs are reachable
        run: |
          FAILED=0

          check_url() {
            local url="$1"
            local source="$2"
            echo -n "  Checking: $url ... "
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 15 "$url" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
              echo "OK ($HTTP_CODE)"
            else
              echo "FAIL ($HTTP_CODE) [from $source]"
              FAILED=1
            fi
          }

          echo "=== Checking containerd download URL ==="
          CONTAINERD_VERSION=$(grep -oP 'CONTAINERD_VERSION=\K[0-9.]+' master.sh | head -1)
          if [ -n "$CONTAINERD_VERSION" ]; then
            check_url "https://github.com/containerd/containerd/releases/download/v${CONTAINERD_VERSION}/containerd-${CONTAINERD_VERSION}-linux-amd64.tar.gz" "master.sh"
          fi

          echo "=== Checking etcdctl download URL ==="
          ETCDCTL_VERSION=$(grep -oP 'ETCDCTL_VERSION=\K[v0-9.]+' master.sh | head -1)
          if [ -n "$ETCDCTL_VERSION" ]; then
            check_url "https://github.com/etcd-io/etcd/releases/download/${ETCDCTL_VERSION}/etcd-${ETCDCTL_VERSION}-linux-amd64.tar.gz" "master.sh"
          fi

          echo "=== Checking Calico manifest URL ==="
          CALICO_URL=$(grep -oP 'https://raw.githubusercontent.com/projectcalico/calico/[^"]+' kmaster.sh | head -1)
          if [ -n "$CALICO_URL" ]; then
            check_url "$CALICO_URL" "kmaster.sh"
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "::error::One or more download URLs are not reachable"
            exit 1
          fi
          echo ""
          echo "All download URLs are reachable"
